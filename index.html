<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abrilo cuando…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0d10;--bg2:#1a1519;--fg:#f3ece8;--mut:#a89c9c;--line:rgba(255,255,255,.12);--card:rgba(255,255,255,.04);--acc:#e8a0a8;--panel:#17131a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#faf5f2;--bg2:#f1e3e0;--fg:#2a2226;--mut:#7d6e72;--line:rgba(0,0,0,.12);--card:rgba(255,255,255,.6);--acc:#c25b6b;--panel:#fffaf8}}
:root[data-theme="light"]{--bg:#faf5f2;--bg2:#f1e3e0;--fg:#2a2226;--mut:#7d6e72;--line:rgba(0,0,0,.12);--card:rgba(255,255,255,.6);--acc:#c25b6b;--panel:#fffaf8}
:root[data-theme="dark"]{--bg:#0e0d10;--bg2:#1a1519;--fg:#f3ece8;--mut:#a89c9c;--line:rgba(255,255,255,.12);--card:rgba(255,255,255,.04);--acc:#e8a0a8;--panel:#17131a}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(ellipse at 20% 0%,var(--bg2),var(--bg) 60%) fixed;color:var(--fg);font-family:Inter,system-ui,sans-serif;font-weight:300;overflow-x:hidden}
.dots{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.dots i{position:absolute;bottom:-20px;width:6px;height:6px;border-radius:50%;background:var(--acc);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.5}100%{transform:translateY(-110vh) translateX(30px) scale(1.2);opacity:0}}
main{position:relative;max-width:980px;margin:0 auto;padding:12vh 24px 10vh}
header{text-align:center;margin-bottom:9vh}
header small{letter-spacing:.35em;text-transform:uppercase;color:var(--mut);font-size:11px;display:block;opacity:0;animation:up 1s .2s forwards}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:clamp(44px,9vw,92px);line-height:1;margin:18px 0;opacity:0;animation:up 1.2s .4s forwards}
h1 em{color:var(--acc)}
header p{color:var(--mut);max-width:420px;margin:0 auto;line-height:1.7;opacity:0;animation:up 1.2s .7s forwards}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{position:relative;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px 24px;min-height:170px;cursor:pointer;overflow:hidden;opacity:0;animation:up .9s forwards;transition:transform .5s cubic-bezier(.2,.8,.2,1),border-color .4s,background .4s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--x,50%) var(--y,0%),color-mix(in srgb,var(--acc) 22%,transparent),transparent 60%);opacity:0;transition:opacity .4s}
.card:hover,.card:focus-visible{transform:translateY(-6px);border-color:var(--acc);outline:none}
.card:hover::before{opacity:1}
.card:active{transform:scale(.98)}
.n{font-family:"Cormorant Garamond",Georgia,serif;font-size:15px;color:var(--acc);letter-spacing:.2em}
.card b{display:block;font-weight:300;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-top:34px}
.card span.t{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:25px;line-height:1.15;margin-top:6px;position:relative}
.card i.ln{position:absolute;left:22px;bottom:16px;height:1px;width:18px;background:var(--acc);transition:width .5s}
.card:hover i.ln{width:calc(100% - 44px)}
.ov{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.55);backdrop-filter:blur(0);opacity:0;visibility:hidden;transition:opacity .45s,backdrop-filter .45s,visibility 0s .45s;z-index:10}
.ov.on{opacity:1;visibility:visible;backdrop-filter:blur(10px);transition:opacity .45s,backdrop-filter .45s}
.pn{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:relative;width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px 30px 38px;transform:translateY(40px) scale(.94) rotateX(8deg);opacity:0;transition:transform .7s cubic-bezier(.2,.9,.2,1),opacity .5s}
.ov.on .pn{transform:none;opacity:1}
.x{-webkit-tap-highlight-color:transparent;position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--fg);font-size:20px;cursor:pointer;transition:transform .4s,border-color .3s}
.x:hover{transform:rotate(90deg);border-color:var(--acc)}
.ph{position:relative;width:100%;aspect-ratio:8/7;border-radius:14px;border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;margin-bottom:26px;color:var(--mut);font-size:13px;cursor:pointer;transition:border-color .3s}
.ph:hover{border-color:var(--acc)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;animation:fade 1s}
.ph input{display:none}
@keyframes fade{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
.pn h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:clamp(30px,6vw,40px);line-height:1.1;margin-bottom:22px}
.pn h2 em{color:var(--acc)}
.pn p{line-height:1.85;color:var(--fg);opacity:0;margin-bottom:14px;animation:up .9s forwards}
.sig{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:22px;color:var(--acc);margin-top:22px}
.card:active{transform:scale(.96);border-color:var(--acc)}
.card:active::before{opacity:1}
.card:active i.ln{width:calc(100% - 44px)}
@media (hover:none){.card:hover{transform:none;border-color:var(--line)}.card:hover::before{opacity:0}.card:hover i.ln{width:18px}.card:active{transform:scale(.96);border-color:var(--acc)}.card:active::before{opacity:1}.card:active i.ln{width:calc(100% - 44px)}}
@media (max-width:640px){
main{padding:9vh 16px 8vh}
.grid{grid-template-columns:1fr 1fr;gap:12px}
.card{min-height:150px;padding:20px 16px}
.card b{margin-top:26px}
.card span.t{font-size:21px}
.card i.ln{left:16px;bottom:14px}
.card:active i.ln{width:calc(100% - 32px)}
.ov,.ov.on{backdrop-filter:none;-webkit-backdrop-filter:none;place-items:end center;padding:0}
.ov{background:rgba(0,0,0,0);transition:background .4s,opacity .4s,visibility 0s .4s}
.ov.on{background:rgba(0,0,0,.62);transition:background .4s,opacity .4s}
.pn{width:100%;max-height:92dvh;border-radius:26px 26px 0 0;border-bottom:0;padding:12px 20px calc(34px + env(safe-area-inset-bottom,0px));transform:translateY(100%);opacity:1;transition:transform .6s cubic-bezier(.22,1,.36,1);will-change:transform}
.ov.on .pn{transform:none}
.pn::before{content:"";display:block;width:44px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 18px}
.x{top:18px;right:14px;z-index:2;background:rgba(0,0,0,.35);color:#fff;border-color:transparent}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="dots" id="dots"></div>
<main>
  <header>
    <small>para vos</small>
    <h1>Abrilo <em>cuando…</em></h1>
    <p>Cada carta es para un momento distinto. Elegí la que necesites ahora.</p>
  </header>
  <div class="grid" id="grid"></div>
</main>
<div class="ov" id="ov" aria-hidden="true">
  <div class="pn" role="dialog" aria-modal="true">
    <button class="x" id="x" aria-label="Cerrar">×</button>
    <label class="ph" id="ph"><span>Tocá para agregar una foto</span><input type="file" accept="image/*" id="file"></label>
    <h2 id="ttl"></h2>
    <div id="txt"></div>
  </div>
</div>

/* ===== EDITÁ ACÁ LOS TEXTOS DE CADA CARTA ===== */
var FIRMA = "Te amo. ";
var CARTAS = [
 {k:"Leelo cuando",t:"creas que <em>no te amo</em>",p:[
  "Si estás leyendo esto, es porque en algún momento dudaste. Y está bien, a todos nos pasa. Pero quiero que sepas la verdad.",
  "Te elijo todos los días, incluso en los días difíciles. No es costumbre es una decisión que la tomo todos los dias.",
  "Si alguna vez no te lo demuestro como mereces, no es que te ame menos. Es que soy boludo. Pero mi amor por vos es real."]},
 {k:"Abrilo cuando",t:"te sientas <em>sola</em>",p:[
  "Aunque ahora no esté al lado tuyo, estoy con vos. En cada pensamiento, en cada cosa que hago, estoy ahi .",
  "No estás sola. Tenés a alguien que te quiere un montón y que siempre va a estar con vos.",
  "y desde aca este donde este te mando un abrazo para que te sientas protegida ."]},
 {k:"Abrilo cuando",t:"estés <em>enojada conmigo</em>",p:[
  "Seguramente la cague, y tenés todo el derecho a estar enojada. asique nada: perdón.",
  "Quiero que sepas que prefiero mil veces escucharte y arreglar las cosas, antes que perderte.",
  "Cuando estés lista, hablemos. Acá voy a estar con ganas de hacerlo mejor."]},
 {k:"Abrilo cuando",t:"estés <em>triste</em>",p:[
  "Me duele que estés mal, y me gustaría poder sacarte esa tristeza .",
  "llorá si lo necesitás que después de la tormenta siempre sale el sol, ahre .",
  "Sos muy fuerte vos podes wachi"]},
 {k:"Abrilo cuando",t:"estés <em>feliz</em>",p:[
  "¡Me encanta saberlo! Tu sonrisa es lo mejor que le pasa a mis días.",
  "Disfrutá este momento, guardalo bien. Y si puedo ser parte de esa felicidad, soy el hombre más afortunado.",
  "Contame todo cuando nos veamos. Quiero reírme con vos."]},
 {k:"Abrilo cuando",t:"estés <em>celosa</em>",p:[
  "Primero: ningún sentimiento tuyo es ridículo para mí. Si te sentís así, quiero entenderlo.",
  "Mi corazón tiene un solo nombre, y es el tuyo. Nadie ocupa tu lugar ni lo va a ocupar.",
  "Si algo te inquieta, decímelo sin miedo. Prefiero que lo hablemos juntos a que lo cargues sola."]},
 {k:"Abrilo cuando",t:"pienses que <em>te cambié por algo más</em>",p:[
  "No hay nada, ni nadie, ni ningún plan que esté por encima de vos.",
  "Si alguna vez parece que le doy más tiempo a otra cosa, avisame y lo conversamos. Nunca quiero que dudes de tu lugar en mi vida.",
  "Vos no sos una opción entre muchas. Sos mi lugar favorito."]},
 {k:"Abrilo cuando",t:"me <em>extrañes</em>",p:[
  "Yo también te extraño. Más de lo que puedo explicar con palabras.",
  "Pensá en la próxima vez que nos veamos, en ese abrazo largo que nos debemos.",
  "Mientras tanto, guardame un lugarcito en tus pensamientos, que yo ya te tengo uno en todos los míos."]}
];

  var b=document.createElement("button");

function showImg(src){
  var old=ph.querySelector("img");if(old)old.remove();
  var s=ph.querySelector("span");
  if(src){var im=new Image();im.src=src;ph.appendChild(im);s.style.display="none"}else{s.style.display=""}
}
function openCard(i){
  cur=i;var c=CARTAS[i];if(navigator.vibrate)navigator.vibrate(10);
  ttl.innerHTML=c.k+" "+c.t;
  var h="";c.p.forEach(function(p,j){h+='<p style="animation-delay:'+(.5+j*.28)+'s">'+p+'</p>'});
  h+='<div class="sig" style="opacity:0;animation:up .9s '+(.5+c.p.length*.28)+'s forwards">'+FIRMA+'</div>';
  txt.innerHTML=h;
  showImg(getImg(i));
  ov.classList.add("on");document.documentElement.style.overflow="hidden";ov.setAttribute("aria-hidden","false");
  document.querySelector(".pn").scrollTop=0;
}
function closeCard(){document.documentElement.style.overflow="";ov.classList.remove("on");ov.setAttribute("aria-hidden","true")}
document.getElementById("x").onclick=closeCard;
ov.onclick=function(e){if(e.target===ov)closeCard()};
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeCard()});

file.onchange=function(){
  var f=file.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var m=900,s=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement("canvas");
      cv.width=im.width*s;cv.height=im.height*s;
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      var d=cv.toDataURL("image/jpeg",.8);
      showImg(d);
      try{localStorage.setItem("img"+cur,d)}catch(e){}
    };
    im.src=r.result;
  };
  r.readAsDataURL(f);
};

var pn=document.querySelector(".pn"),sy=0,dy=0,drag=false;
pn.addEventListener("touchstart",function(e){if(innerWidth>640||pn.scrollTop>0)return;sy=e.touches[0].clientY;dy=0;drag=true},{passive:true});
pn.addEventListener("touchmove",function(e){if(!drag)return;dy=e.touches[0].clientY-sy;if(dy>0){pn.style.transition="none";pn.style.transform="translateY("+dy+"px)"}else{dy=0}},{passive:true});
pn.addEventListener("touchend",function(){if(!drag)return;drag=false;pn.style.transition="";if(dy>110)closeCard();pn.style.transform=""},{passive:true});

var dots=document.getElementById("dots");
for(var k=0;k<(innerWidth<640?10:22);k++){
  var d=document.createElement("i");
  d.style.left=Math.random()*100+"%";
  d.style.animationDuration=(9+Math.random()*12)+"s";
  d.style.animationDelay=(-Math.random()*20)+"s";
  d.style.width=d.style.height=(3+Math.random()*5)+"px";
  dots.appendChild(d);
}
</script>
